<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16181d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e4e5ea;border-radius:10px;">
            <tr>
              <td style="padding:32px 32px 8px;">
                <p style="margin:0 0 24px;font-size:15px;font-weight:600;letter-spacing:-0.01em;">Foco aí</p>
                <h1 style="margin:0 0 8px;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-0.015em;">Confirme seu e-mail</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#5b6170;">Falta um passo para ativar sua conta. Toque no botão abaixo para confirmar este endereço.</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/painel" style="display:inline-block;background:#5b60d6;color:#ffffff;text-decoration:none;font-size:14px;font-weight:500;padding:10px 18px;border-radius:6px;">Confirmar e-mail</a>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;">
                <p style="margin:0;font-size:12.5px;line-height:1.6;color:#8c91a0;">Se você não criou uma conta no Foco aí, ignore este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
