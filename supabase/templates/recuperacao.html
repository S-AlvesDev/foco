<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#16181d;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e4e5ea;border-radius:10px;">
            <tr>
              <td style="padding:32px 32px 8px;">
                <p style="margin:0 0 24px;font-size:15px;font-weight:600;letter-spacing:-0.01em;">Missão Alpha-01</p>
                <h1 style="margin:0 0 8px;font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-0.015em;">Criar nova senha</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#5b6170;">Recebemos um pedido para trocar a senha da sua conta. O link vale por 1 hora e só pode ser usado uma vez.</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha" style="display:inline-block;background:#5b60d6;color:#ffffff;text-decoration:none;font-size:14px;font-weight:500;padding:10px 18px;border-radius:6px;">Criar nova senha</a>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;">
                <p style="margin:0;font-size:12.5px;line-height:1.6;color:#8c91a0;">Se não foi você, ignore este e-mail. Sua senha atual continua valendo.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
